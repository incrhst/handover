# On every push and pull request: the format files, the skill and the app all build.
name: Check
on: [push, pull_request]
jobs:
  check:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v7
      - run: scripts/sync-shared.sh --check
      - run: node skills/handover/scripts/handover.cjs check site/examples/sample.handover
      - run: node skills/handover/scripts/handover.cjs check site/examples/ea-no-overlap.handover
      - run: node --test test/*.test.cjs
      - run: scripts/build-app.sh 0.0.0
